volumes:
  mariadb:
    name: mariadb
    driver: local
services:

  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "443:443"
    networks: 
      - ft_transcendence
    restart: on-failure
    depends_on:
      - frontend
      - backend
    env_file: .env
    
  frontend:
    container_name: frontend
    build: 
      context: ..
      dockerfile: ./docker/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - ft_transcendence
    restart: on-failure
    volumes:
      - ../srcs/frontend:/app
      - /app/node_modules

  mariadb:
    container_name: mariadb
    build: ./mariadb
    ports:
      - "3306:3306"
    networks:
      - ft_transcendence
    volumes:
      - mariadb:/var/lib/mysql
    restart: on-failure
    expose:
      - "3306"
    env_file: .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    container_name: backend
    build: 
      context: ..
      dockerfile: ./docker/backend/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - ft_transcendence
    volumes:
      - ../srcs/backend:/app
      - /app/node_modules
    restart: on-failure
    env_file: .env

networks:
  ft_transcendence:
    name: ft_transcendence
    driver: bridge
